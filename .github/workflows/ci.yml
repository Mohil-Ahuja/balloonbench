name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"

      # The OCCT stack is the whole point of the environment gate, so CI runs the same
      # check a developer runs locally before touching any module.
      - name: Environment gate
        run: python scripts/check_env.py

      - name: Lint
        run: ruff check balloonbench scripts tests

      - name: Test
        run: pytest
