[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balloonbench"
version = "0.1.0"
description = "A synthetic-first benchmark, evaluation harness, and geometry-grounded verifier for GD&T extraction from 2D engineering drawings."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "BalloonBench contributors" }]
keywords = ["gd&t", "engineering-drawings", "benchmark", "cad", "opencascade"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# The OCCT binding is OCP, pulled in by cadquery. pythonocc-core is deliberately NOT a
# dependency: the two bindings ship separate copies of the OCCT shared libraries and must
# not be loaded into the same interpreter. See PLAN.md section 0.1.
dependencies = [
  "cadquery>=2.5",
  # nlopt and casadi are both cadquery dependencies (its constraint solver). Loading
  # nlopt 2.10 or newer alongside casadi 3.8.0 into the same interpreter crashes on
  # shutdown: the import succeeds and results are correct, but the process dies -- exit
  # 139 on Linux, 0xC0000005 on Windows -- which breaks CI and any shell chaining.
  # nlopt 2.9.1 does not. The ceiling was <2.11 and was one version too loose: CI
  # resolved 2.10.0 and every Windows job failed the environment gate while a local
  # machine holding 2.9.1 passed. Do not relax it without re-running
  # scripts/check_env.py, whose "clean interpreter shutdown" check exists for this.
  "nlopt>=2.9,<2.10",
  "ezdxf>=1.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "pillow>=10",
  "pypdfium2>=4",          # BSD-3 rasteriser
  "pdfplumber>=0.11",      # MIT vector/text extraction
  "reportlab>=4",
  "svgwrite>=1.4",
  "pydantic>=2.6",
  "jsonschema>=4.20",
  "typer>=0.12",
  "rich>=13",
  "tqdm>=4.66",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "fonttools>=4.50",     # glyph-coverage check on the vendored drawing font
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]
vision = ["opencv-python>=4.9"]
baselines = ["anthropic>=0.34", "openai>=1.40", "google-genai>=0.3"]
detr = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20", "python-doctr>=0.9"]
demo = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# AGPL-3.0. Isolated behind an extra so the core package stays Apache-2.0 clean.
# Nothing under balloonbench/ may import pymupdf. See PLAN.md section 0.2.
agpl = ["pymupdf>=1.24"]

[project.scripts]
balloonbench = "balloonbench.cli:app"

[tool.setuptools.packages.find]
include = ["balloonbench*"]

# The tier-4 cost weights are data the harness reads at runtime, not a developer-only file,
# so they must travel with an installed wheel.
[tool.setuptools.package-data]
balloonbench = ["evalkit/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules -m 'not slow'"
# Doctests in the modules are executable documentation: the worked ISO 286 examples in
# fits.py are checked on every run, so a docstring cannot drift from the code.
filterwarnings = ["error::DeprecationWarning:balloonbench.*"]
# The full 200-sample-per-family gate is slow. Deselected by default, run with
#   pytest -m slow
markers = ["slow: the full Milestone 1 acceptance sweep"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
